name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Install pnpm and dependencies
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          pnpm install --frozen-lockfile
      - name: Generate the production site
        env:
          NITRO_PRESET: github_pages
          NUXT_APP_BASE_URL: /
          NUXT_SITE_URL: https://hadb.me
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: pnpm generate
      - name: Check the generated site
        run: |
          test -s .output/public/index.html
          grep -Fq 'https://hadb.me/atom.xml' .output/public/atom.xml
          grep -Fq 'url=/posts' .output/public/archives.html
          grep -Fq 'href="/favicon/' .output/public/index.html
          site_bytes=$(du -sb .output/public | cut -f1)
          echo "Generated site: $site_bytes bytes" >> "$GITHUB_STEP_SUMMARY"
          test "$site_bytes" -lt 1000000000
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the production site
        id: deployment
        uses: actions/deploy-pages@v4

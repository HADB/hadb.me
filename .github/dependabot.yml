version: 2
updates:
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 20
    schedule:
      interval: weekly
      timezone: Asia/Shanghai
    cooldown:
      default-days: 3
      semver-major-days: 30
    groups:
      npm-non-major:
        patterns: ['*']
        update-types: [minor, patch]
      npm-security-non-major:
        applies-to: security-updates
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Shanghai
    groups:
      actions-non-major:
        patterns: ['*']
        update-types: [minor, patch]
